<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#16161a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sprüche">

  <title>Meine Sprüche</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <style>
    :root {
      color-scheme: dark;
      --bg: #16161a;
      --card: #232329;
      --text: #f5f5f7;
      --muted: #a8a8b3;
      --button: #f5f5f7;
      --button-text: #16161a;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        calc(24px + env(safe-area-inset-top))
        22px
        calc(24px + env(safe-area-inset-bottom));
    }

    .app {
      width: min(100%, 520px);
    }

    .label {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .card {
      min-height: 300px;
      background: var(--card);
      border-radius: 28px;
      padding: 34px 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 18px 50px rgba(0,0,0,.25);
    }

    #spruch {
      margin: 0;
      text-align: center;
      font-size: clamp(26px, 7vw, 36px);
      line-height: 1.28;
      font-weight: 700;
      letter-spacing: -0.02em;
      transition: opacity .16s ease, transform .16s ease;
    }

    #spruch.wechsel {
      opacity: 0;
      transform: translateY(5px);
    }

    button {
      width: 100%;
      margin-top: 18px;
      border: 0;
      border-radius: 18px;
      padding: 19px 22px;
      background: var(--button);
      color: var(--button-text);
      font: inherit;
      font-size: 19px;
      font-weight: 750;
      cursor: pointer;
      transition: transform .08s ease, opacity .08s ease;
    }

    button:active {
      transform: scale(.98);
      opacity: .9;
    }

    .hinweis {
      margin-top: 16px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
      line-height: 1.45;
    }
  </style>
</head>

<body>
  <main class="app">
    <div class="label">Dein Spruch</div>

    <section class="card" aria-live="polite">
      <p id="spruch">Drücke den Button.</p>
    </section>

    <button id="button" type="button">Neuer Spruch</button>

    <div class="hinweis">Funktioniert nach dem ersten Laden auch offline.</div>
  </main>

  <script>
    const sprueche = [
  "Der beste Zeitpunkt anzufangen ist jetzt.",
  "Kleine Schritte bringen dich auch ans Ziel.",
  "Mach es einfach. Verbessern kannst du später.",
  "Du musst nicht alles heute schaffen.",
  "Mut beginnt oft mit einem kleinen Schritt.",
  "Konzentriere dich auf das, was du beeinflussen kannst.",
  "Ein Umweg ist nicht automatisch ein Rückschritt.",
  "Fortschritt ist wichtiger als Perfektion.",
  "Manchmal ist weniger genau richtig.",
  "Du darfst deine Meinung ändern.",
  "Ein schlechter Tag macht kein schlechtes Leben.",
  "Dein Tempo ist trotzdem Fortschritt.",
  "Fang klein an, aber fang an.",
  "Ruhe ist auch produktiv.",
  "Vergleiche deinen Anfang nicht mit dem Ziel anderer.",
  "Du kannst neu anfangen, so oft du willst.",
  "Nicht jede Entscheidung muss perfekt sein.",
  "Heute reicht ein guter nächster Schritt.",
  "Geduld ist auch eine Form von Stärke.",
  "Du musst nicht auf Motivation warten.",
  "Was du regelmäßig tust, wird leichter.",
  "Eine Pause kann Teil des Weges sein.",
  "Manchmal entsteht Klarheit erst durchs Tun.",
  "Es ist okay, Dinge einfacher zu machen.",
  "Dein zukünftiges Ich wird dir für kleine Schritte danken.",
  "Du musst nicht überall gleichzeitig sein.",
  "Ein Nein kann Platz für ein besseres Ja schaffen.",
  "Es ist nie zu spät, etwas anders zu machen.",
  "Nicht alles verdient deine Energie.",
  "Auch langsamer Fortschritt zählt.",
  "Du darfst stolz auf kleine Erfolge sein.",
  "Der nächste Schritt muss nicht groß sein.",
  "Gute Dinge brauchen manchmal mehrere Anläufe.",
  "Du kannst heute etwas leichter machen als gestern.",
  "Klarheit kommt oft nach dem ersten Versuch.",
  "Du brauchst keinen perfekten Plan für den Anfang.",
  "Ein bisschen besser ist immer noch besser.",
  "Du darfst dir Zeit lassen.",
  "Manchmal ist Durchhalten leiser als gedacht.",
  "Du musst nicht jede Chance nutzen.",
  "Deine Aufmerksamkeit ist wertvoll.",
  "Heute ist ein guter Tag, um etwas Neues zu probieren.",
  "Wenn es kompliziert wird, mach den nächsten Schritt kleiner.",
  "Du kannst mehr ändern, als du gerade denkst.",
  "Ein ruhiger Tag kann ein guter Tag sein.",
  "Manchmal ist die beste Entscheidung, etwas wegzulassen.",
  "Du musst nicht alles erklären.",
  "Gib dir die Chance, überrascht zu werden.",
  "Wieder anfangen zählt genauso wie anfangen.",
  "Der nächste gute Moment kann jetzt sein."
];

    const anzeige = document.getElementById("spruch");
    const button = document.getElementById("button");
    let letzterIndex = -1;

    function neuerSpruch() {
      let index;

      do {
        index = Math.floor(Math.random() * sprueche.length);
      } while (sprueche.length > 1 && index === letzterIndex);

      letzterIndex = index;
      anzeige.classList.add("wechsel");

      window.setTimeout(() => {
        anzeige.textContent = sprueche[index];
        anzeige.classList.remove("wechsel");
      }, 160);
    }

    button.addEventListener("click", neuerSpruch);

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js");
      });
    }
  </script>
</body>
</html>
